[project]
name = "speakerstyle"
version = "0.1.0"
readme = "README.md"
license = { file = "LICENSE" }
description = "Turn speaker portraits and object photos into one halftone cut-out house style, with a local lab and an optional Claude judge"
requires-python = ">=3.10,<3.14"
dependencies = ["opencv-python-headless>=4.9", "numpy", "pillow", "rembg[cpu]>=2.0.60"]

[project.scripts]
speakerstyle = "speakerstyle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakerstyle"]
